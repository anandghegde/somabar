name: Somabar
options:
  bundleIdPrefix: app.somabar
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  SomabarKit:
    path: .
  # App target only; the library targets in Package.swift stay free of it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Somabar:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Support/**"
    dependencies:
      - package: SomabarKit
        product: SomabarCore
      - package: SomabarKit
        product: BarEngine
      - package: SomabarKit
        product: NotchKit
      - package: Sparkle
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleName: Somabar
        CFBundleDisplayName: Somabar
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        # Agent app: no Dock icon, no main menu.
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Somabar contributors. GPL-3.0."
        # Triggers only read whether another app is using the camera or the microphone, through
        # device properties that need no permission. The strings are here so that, should macOS
        # ever gate those reads, it asks instead of ending the process.
        NSCameraUsageDescription: "Somabar only checks whether another app is using the camera, for your triggers. It never captures video."
        NSMicrophoneUsageDescription: "Somabar only checks whether another app is using the microphone, for your triggers. It never records audio."
        # Now Playing in the notch: the track's position, its artwork and the play controls for
        # Music and Spotify go over AppleScript; so does the spacing notice's Log Out (System Events).
        NSAppleEventsUsageDescription: "Somabar shows what Music or Spotify is playing in the notch and passes on play, pause, skip and seeking. It asks System Events to log you out only when you choose Log Out."
        # Sparkle 2. Updates stay off until both are non-empty. Both come from
        # Config/Somabar.xcconfig; the key is empty unless the untracked
        # Config/Release.local.xcconfig sets it (see README, Releasing).
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: app.somabar.url
            CFBundleURLSchemes: [somabar]
    configFiles:
      Debug: Config/Somabar.xcconfig
      Release: Config/Somabar.xcconfig
    entitlements:
      path: App/Support/Somabar.entitlements
      properties:
        # Hardened runtime blocks Apple events without this (Now Playing's AppleScript, Log Out).
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_NAME: Somabar
        PRODUCT_BUNDLE_IDENTIFIER: app.somabar.Somabar
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # No sandbox (the Accessibility API and CGEvent posting need the full process), but
        # hardened runtime on. Ad-hoc signing: Accessibility trust resets on every rebuild.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Somabar:
    build:
      targets:
        Somabar: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
