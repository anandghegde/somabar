# Builds, signs, notarizes and publishes a release when a v* tag is pushed, by running
# Scripts/release.sh with SOMABAR_PUBLISH=1. Nothing secret is in the repository: the Developer
# ID certificate, the notary API key and the Sparkle private key come from repository secrets
# and live only in the runner's temporary directory and a throwaway keychain.
#
# Repository secrets:
#   DEVELOPER_ID_P12_BASE64    Developer ID Application certificate + key, .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  its password
#   NOTARY_KEY_P8_BASE64       App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID              its key ID
#   NOTARY_ISSUER_ID           its issuer ID
#   SPARKLE_PRIVATE_KEY        output of Scripts/sparkle-keys.sh --export <file>
# Repository variables:
#   SOMABAR_SIGN_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   SPARKLE_PUBLIC_ED_KEY      the public key (not secret)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SOMABAR_SIGN_IDENTITY: ${{ vars.SOMABAR_SIGN_IDENTITY }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      SOMABAR_NOTARY_PROFILE: somabar-ci
      SOMABAR_PUBLISH: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches MARKETING_VERSION
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *//p' project.yml | tr -d '"')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi

      - name: Install tools
        run: brew install xcodegen

      - name: Set up signing and notarization
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials somabar-ci --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          (umask 077 && printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key")
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          echo "SOMABAR_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      - name: Release
        run: Scripts/release.sh

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/sparkle.key"
